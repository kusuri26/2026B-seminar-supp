<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$$if(isnote)$ · $sitetitle$$endif$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+JP:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="$root$style.css">
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    svg: { fontCache: 'global' }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
</head>
<body class="$if(isnote)$note$else$home$endif$">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="$root$index.html">$sitetitle$</a>
    <nav><a href="$root$index.html">Notes</a></nav>
  </div>
</header>

<div class="layout">
$if(toc)$
  <aside class="toc">
    <details open>
      <summary>Contents</summary>
$table-of-contents$
    </details>
  </aside>
$endif$
  <main class="content">
$if(date)$
    <div class="eyebrow">$date$</div>
$endif$
$body$
  </main>
</div>

<footer class="footer">
  <div class="footer-inner">
$if(isnote)$
    <a href="$root$index.html">← All notes</a>
$endif$
    <span>$sitetitle$</span>
  </div>
</footer>
<script>
  // Contents: open beside the text on wide screens, collapsed on phones
  if (window.matchMedia('(max-width: 1060px)').matches) {
    document.querySelectorAll('.toc details').forEach(d => d.removeAttribute('open'));
  }
</script>
</body>
</html>
